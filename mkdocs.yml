theme: 
  name: 'material'
  palette:
    - scheme: light
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: 'Roboto'
    code: 'Oswald Thin'
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.expand
    - navigation.path
    - search
  language: ru
  logo: images/deadmooncult_ico.ico
  favicon: images/deadmooncult_favico.png
extra_css:
  - stylesheets/extra.css
  - stylesheets/neoteroi-mkdocs.css
  - stylesheets/neoteroi-timeline.css
extra:
  article_nav_top: false
  article_nav_bottom: false
  history_buttons: false
  generator: false
plugins:
  - search
  - mermaid2
  - autolinks
  - tags:
      enabled: true
  - obsidian-bridge
  - obsidian-support
  - git-revision-date-localized
extra_javascript:
  - assets/javascripts/obsidian_tags.js
  - assets/javascripts/graph_force.js
markdown_extensions:
  - nl2br
  - abbr
  - admonition
  - attr_list
  - smarty
  - tables
  - def_list
  - footnotes
  - md_in_html
  - meta
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde